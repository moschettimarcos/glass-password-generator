<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <span class="blob orange"></span>
        <span class="blob rose"></span>
        <span class="blob amber"></span>
    </div>

    <main class="page">
        <div class="card">
            <h1>Password Generator</h1>

            <div class="output">
                <span id="password"></span>
                <button id="copy" class="copy" aria-label="copy">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="11" height="11" rx="2" />
                        <path d="M5 15V5a2 2 0 0 1 2-2h10" />
                    </svg>
                </button>
            </div>

            <div class="strength">
                <div class="bar" id="bar"></div>
            </div>

            <label class="length">
                Length <span id="lengthValue">16</span>
                <input type="range" id="length" min="8" max="32" value="16">
            </label>

            <div class="options">
                <label><input type="checkbox" data-charset="upper" checked> Uppercase</label>
                <label><input type="checkbox" data-charset="lower" checked> Lowercase</label>
                <label><input type="checkbox" data-charset="numbers" checked> Numbers</label>
                <label><input type="checkbox" data-charset="symbols" checked> Symbols</label>
            </div>
            <button id="generate" class="generate">Generate</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
